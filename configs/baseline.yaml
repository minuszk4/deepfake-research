seed: 42
epochs: 10
patience: 3
frames_per_video: 5

dataset:
  mode: "faces"
  video_csv: "master_split.csv"
  faces_csv: "/kaggle/input/ffpp_faces_c23/kaggle/working/ffpp_faces_c23/csv/faces_master.csv"
  max_videos: 2000  # 2000 video = 10,000 ảnh (5 frames/video)
  train_ratio: 0.70 # 70% Train = 1,400 video (7,000 ảnh)
  val_ratio: 0.15   # 15% Val   = 300 video (1,500 ảnh)
  test_ratio: 0.15  # 15% Test  = 300 video (1,500 ảnh)
  balance_classes: true # Cân bằng 50% Real / 50% Fake




models:
  meso4:
    type: "custom"
    name: "meso4"
    img_size: 256
    batch_size: 32
    lr: 0.001
  freq_meso:
    type: "custom"
    name: "freq_meso"
    img_size: 256
    batch_size: 32
    lr: 0.0005
  mobilenetv3:
    type: "timm"
    name: "mobilenetv3_large_100"
    img_size: 224
    batch_size: 32
    lr: 0.0001
  efficientnet_b4:
    type: "timm"
    name: "tf_efficientnet_b4.ns_jft_in1k"
    img_size: 380
    batch_size: 8
    lr: 0.0001
  xception:
    type: "timm"
    name: "legacy_xception"
    img_size: 299
    batch_size: 16
    lr: 0.0002
  vit:
    type: "timm"
    name: "vit_small_patch16_224"
    img_size: 224
    batch_size: 16
    lr: 0.00005

